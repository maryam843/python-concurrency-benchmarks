name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the PII/secret scan reads every commit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.9
      - name: Ruff
        run: ruff check .
      - name: PII and secret scan (full history)
        run: python tools/pii_scan.py --worktree

  test:
    needs: lint-and-scan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # regression tests read the 2025 import commits
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MPI (Linux only; MPI tests are skipped on Windows)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Install mpi4py (Linux only)
        if: runner.os == 'Linux'
        run: pip install -r requirements-mpi.txt
      - name: Tests with coverage (default start method)
        run: python -m pytest -q --cov --cov-report=term --cov-fail-under=85
      - name: Tests forced to spawn (Linux; Windows already uses spawn)
        if: runner.os == 'Linux'
        env:
          PCB_START_METHOD: spawn
        run: python -m pytest -q -m "not slow"
      - name: README claims match results/
        run: python tools/check_readme_claims.py
      - name: Notebooks execute headless (Linux)
        if: runner.os == 'Linux'
        env:
          PCB_NOTEBOOK_N: "200000"
        run: |
          python -m ipykernel install --user --name python3
          python tools/run_notebooks.py
