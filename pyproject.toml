[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-concurrency-benchmarks"
version = "1.0.0"
description = "Measured guide to when threads, processes and MPI help in Python (DSAI3202 coursework, fixed and extended in 2026)"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Maryam Mahaboob" }]

[tool.setuptools]
packages = ["bench_common", "threads_vs_processes", "parallel_sum", "connection_pool", "sensor_monitor", "mpi_squares", "nyc_taxi"]

[tool.setuptools.package-dir]
bench_common = "src/bench_common"
threads_vs_processes = "01_threads_vs_processes/src/threads_vs_processes"
parallel_sum = "02_parallel_sum/src/parallel_sum"
connection_pool = "03_connection_pool/src/connection_pool"
sensor_monitor = "04_sensor_monitor/src/sensor_monitor"
mpi_squares = "05_mpi_multi_node/src/mpi_squares"
nyc_taxi = "06_nyc_taxi_pipeline/src/nyc_taxi"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
python_files = ["test_*.py"]
testpaths = ["tests", "01_threads_vs_processes", "02_parallel_sum", "03_connection_pool", "04_sensor_monitor", "05_mpi_multi_node", "06_nyc_taxi_pipeline"]
markers = [
    "mpi: needs an MPI runtime and mpi4py (Linux CI only)",
    "slow: longer integration tests",
]

[tool.ruff.lint.isort]
known-first-party = ["bench_common", "threads_vs_processes", "parallel_sum", "connection_pool", "sensor_monitor", "mpi_squares", "nyc_taxi"]

[tool.coverage.run]
source = [
    "src",
    "01_threads_vs_processes/src",
    "02_parallel_sum/src",
    "03_connection_pool/src",
    "04_sensor_monitor/src",
    "05_mpi_multi_node/src",
    "06_nyc_taxi_pipeline/src",
]
patch = ["subprocess"]
parallel = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if __name__ == .__main__.:"]
